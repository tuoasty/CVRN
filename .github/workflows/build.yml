name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build standalone bundle
        env: 
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: bash scripts/build.sh

      - name: Verify assembled tree
        run: |
          test -f .next/standalone/server.js
          test -d .next/standalone/.next/static
          test -d .next/standalone/public
      
      - name: Package
        run: tar -czf cvrn-standalone.tar.gz -C .next/standalone .

      - uses: actions/upload-artifact@v4
        with: 
          name: cvrn-standalone
          path: cvrn-standalone.tar.gz
          retention-days: 14
          if-no-files-found: error